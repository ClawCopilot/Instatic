# fly.toml — Instatic CMS 生产配置
# 2GB RAM + shared-cpu-2x + 100GB 存储
# 预估月费: ~$27-35

app = "instatic-cms"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3001"
  NODE_ENV = "production"
  DATABASE_URL = "sqlite:/app/data/cms.db"
  UPLOADS_DIR = "/app/uploads"
  STATIC_DIR = "/app/dist"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/admin/"
    protocol = "http"

[mounts]
  source = "instatic_data"
  destination = "/app/data"

[mounts]
  source = "instatic_uploads"
  destination = "/app/uploads"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
