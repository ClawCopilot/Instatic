name: Docker CI

# 每次推送到 main 分支时自动构建 Docker 镜像并推送到 ghcr.io
# 也支持手动触发，可指定 sing-box/cloudflared 版本。
# 参考: link-nvidia 的 CI/CD 模式 — 持续交付，保证 latest 镜像始终可用
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "docs-deploy/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      sing_box_version:
        description: 'sing-box 版本 (留空使用默认)'
        required: false
        default: '1.10.1'
        type: string
      cloudflared_version:
        description: 'cloudflared 版本 (latest = 最新稳定版)'
        required: false
        default: 'latest'
        type: string
      push:
        description: '推送到 ghcr.io? (false = 仅构建不推送)'
        required: false
        default: true
        type: boolean
      image_tag:
        description: '自定义镜像标签 (留空使用 ci-<sha>)'
        required: false
        default: ''
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          VERSION="ci-${GITHUB_SHA::8}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=ci-,format=short
            type=raw,value=latest
            ${{ inputs.image_tag != '' && format('type=raw,value={0}', inputs.image_tag) || '' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          build-args: |
            SING_BOX_VERSION=${{ inputs.sing_box_version || '1.10.1' }}
            CLOUDFLARED_VERSION=${{ inputs.cloudflared_version || 'latest' }}
            INSTATIC_VERSION=${{ steps.meta.outputs.version }}
            INSTATIC_REVISION=${{ github.sha }}
            INSTATIC_CREATED=${{ steps.meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
